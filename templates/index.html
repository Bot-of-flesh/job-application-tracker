<!doctype html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>応募先・選考状況管理アプリ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <p>応募先・選考状況管理アプリ (登録:{{company_count}})</p>
    <form method="get" action="/">
        <input type="text" name="status" value="{{ selected_status }}">
        <button>絞り込む</button>
    </form>
    
    {%if company_list%}
    <ol>
        {% for company in company_list %}
        <li>
            <p>
                <a href="{{ url_for('edit_status', company_id=company['id'])}}">{{ company["name"] }}</a>
                {{company["status"]}}
            </p>
        </li>
        {% endfor %}
    </ol>
    {% else %}
    <p>該当する会社はありません</p>
    {% endif %}
    <a href="{{ url_for('register') }}">会社を登録する</a>
</body>

</html>
